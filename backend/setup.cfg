[flake8]
max-line-length = 120
exclude = venv,migrations,__pycache__,staticfiles
# Stylistic-only ignores:
#   E501 line too long (handled by max-line-length)
#   E302/E303/E305 blank line counts (handled by black/autopep8 style)
#   W291/W293 trailing whitespace
#   W391 blank line at end of file
#   E128/E261 continuation / inline comment spacing
#   W504 line break after binary operator
#   E402 module import not at top (needed for Django setup in some scripts)
ignore = E501,E302,E303,E305,W291,W293,W391,E128,E261,W504,E402
per-file-ignores =
    # Factories use dynamic attribute assignment that triggers F821
    authentication/factories.py: F821
    # Seed scripts are standalone and may have unused imports
    seed_kids_kingdom.py: F401,F841

