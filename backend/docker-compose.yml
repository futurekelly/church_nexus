version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: church_db
    environment:
      POSTGRES_DB: ${DB_NAME:-church_db}
      POSTGRES_USER: ${DB_USER:-church_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-church_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-church_user} -d ${DB_NAME:-church_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: church_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: church_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      - DATABASE_URL=postgres://${DB_USER:-church_user}:${DB_PASSWORD:-church_pass}@db:5432/${DB_NAME:-church_db}
      - CELERY_BROKER_URL=redis://${REDIS_HOST:-redis}:6379/0
      - CELERY_RESULT_BACKEND=redis://${REDIS_HOST:-redis}:6379/0
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    container_name: church_celery
    command: celery -A church_nexus worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      - DATABASE_URL=postgres://${DB_USER:-church_user}:${DB_PASSWORD:-church_pass}@db:5432/${DB_NAME:-church_db}
      - CELERY_BROKER_URL=redis://${REDIS_HOST:-redis}:6379/0
      - CELERY_RESULT_BACKEND=redis://${REDIS_HOST:-redis}:6379/0
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
