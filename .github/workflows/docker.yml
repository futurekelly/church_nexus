name: Docker Validation

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/Dockerfile"
      - "backend/docker-compose.yml"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/Dockerfile"
      - "backend/docker-compose.yml"
      - ".github/workflows/docker.yml"

jobs:
  validate:
    name: Validate Docker Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: docker compose -f backend/docker-compose.yml config --quiet

      - name: Build Docker image
        run: docker build -t church-nexus-backend:ci ./backend

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: church-nexus-backend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Check image does not run as root
        run: |
          USER=$(docker inspect --format='{{.Config.User}}' church-nexus-backend:ci)
          echo "Container user: '$USER'"
          if [ -z "$USER" ] || [ "$USER" = "root" ] || [ "$USER" = "0" ]; then
            echo "WARNING: Container is configured to run as root. Consider adding a non-root USER in Dockerfile."
          else
            echo "OK: Container runs as non-root user: $USER"
          fi
